# tuicr — code review TUI with vim keybindings.
# Symlinked to ~/.config/tuicr/config.toml by scripts/link.sh.
# The VCS (git, jj, hg) is auto-detected, so it is left unset.

# Catppuccin, matching ghostty, nvim and tmux. Macchiato is what ghostty is
# pinned to on both machines, so we are always dark and never need detection.
#
# Not "system": tuicr resolves that by querying the terminal background (OSC 11,
# which tmux swallows), then falling back to gsettings. On a headless Linux box
# `color-scheme` returns 'default', meaning "no preference set", but tuicr reads
# it as an explicit light preference (theme/mod.rs:1802 returns Some(false) for
# 'default'). That short-circuits its own dark fallback, so Linux got latte on a
# dark terminal while the mac read AppleInterfaceStyle correctly and got
# macchiato. Pinning the appearance sidesteps the whole probe.
appearance = "dark"
theme_dark = "catppuccin-macchiato"
theme_light = "catppuccin-latte"   # unused while appearance is pinned

diff_view = "side-by-side"      # toggle in-app with :diff
show_file_list = true           # toggle with <leader>e
wrap = false
cursor_line = true
scroll_offset = 5               # like vim's scrolloff
mouse = true
leader = ";"
comment_vim = true              # vim keys in the comment box, to match nvim
ignore_whitespace = false

# Comment classes, ordered as Tab cycles them. Matches how review feedback is
# triaged when it flows back to an agent: issues block, suggestions are
# optional, notes are questions, praise is noise-free acknowledgement.
comment_types = [
  { id = "issue", definition = "must fix before merge", color = "red" },
  { id = "suggestion", definition = "consider, or explain why not" },
  { id = "note", label = "question", definition = "ask for clarification" },
  { id = "praise", definition = "positive feedback" },
]

[forge]
# Prefix pushed GitHub review comments with their type, so [ISSUE] vs
# [SUGGESTION] survives the round trip to the PR.
comment_type_prefix = true
