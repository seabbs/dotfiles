# jj (Jujutsu) — colocated-git workflow config.
# Symlinked to ~/.config/jj/config.toml by scripts/link.sh.
# jj does NOT read git's user.* config, so identity is set explicitly.

[user]
name = "seabbs-bot"
email = "signin@samabbott.co.uk"

[ui]
editor = "nvim"
default-command = "log"
# tuicr is the review tool, but it is a TUI with no pager mode, so it cannot
# back `jj diff`. delta is already the git pager; reuse it here for casual
# paging and reach for `tuicr` when the diff is actually being reviewed.
pager = ["delta", "--paging=always"]
# Emit git-format diffs so delta, tuicr and other git tooling understand them.
diff-formatter = ":git"

[git]
# Name pushed bookmarks under feat/ by default; never point one at main.
push-bookmark-prefix = "feat/"
