prSections:
    - title: My & Bot PRs
      filters: is:open author:@me author:seabbs-bot
      sort: updated
    - title: Needs My Review
      filters: is:open review-requested:@me
    - title: Involved
      filters: is:open involves:@me -author:@me
    - title: All
      filters: is:open
issuesSections:
    - title: My Issues
      filters: is:open author:@me
    - title: Assigned
      filters: is:open assignee:@me
    - title: Involved
      filters: is:open involves:@me -author:@me
    - title: All
      filters: is:open
notificationsSections:
    - title: All
      filters: ""
    - title: Created
      filters: reason:author
    - title: Participating
      filters: reason:participating
    - title: Mentioned
      filters: reason:mention
    - title: Review Requested
      filters: reason:review-requested
    - title: Assigned
      filters: reason:assign
    - title: Subscribed
      filters: reason:subscribed
    - title: Team Mentioned
      filters: reason:team-mention
repo:
    branchesRefetchIntervalSeconds: 30
    prsRefetchIntervalSeconds: 60
defaults:
    preview:
        # Keep closed: under tmux (TERM=tmux-256color) the terminal swallows
        # gh-dash's OSC 11 background query, so its markdown style is never
        # initialised and rendering a PR preview panics (nil deref in
        # GetMarkdownRenderer). Toggle open in-session at your own risk.
        open: false
        width: 50
    prsLimit: 20
    prApproveComment: LGTM
    issuesLimit: 20
    notificationsLimit: 20
    view: prs
    layout:
        prs:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 20
            author:
                width: 15
            authorIcon:
                hidden: false
            assignees:
                width: 20
                hidden: true
            base:
                width: 15
                hidden: true
            lines:
                width: 15
        issues:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 15
            creator:
                width: 10
            creatorIcon:
                hidden: false
            assignees:
                width: 20
                hidden: true
    refetchIntervalMinutes: 30
keybindings:
    # Available in every view. gh-dash hands over the terminal, so the
    # interactive `gh issue create` prompts (title, then body in nvim) run
    # inside the popup. The repo comes from the selected row, so select
    # anything in the target repo first.
    universal:
        - key: N
          name: new issue
          command: >
            EDITOR=nvim gh issue create --repo {{.RepoName}}
    prs:
        - key: S
          name: open PR session
          command: zsh -ic "prsesh {{.RepoName}} {{.PrNumber}}"
        - key: a
          name: open agent
          command: zsh -ic "agent {{.RepoName}}"
        # tuicr takes over the gh-dash popup and hands it back on quit, so
        # the review stays in the popup instead of spawning a window. `:submit`
        # pushes the review to GitHub with the popup's GH_TOKEN.
        - key: C
          name: code review (tuicr)
          command: >
            ~/code/seabbs/dotfiles/scripts/tuicr-review.sh
            {{.RepoName}} {{.PrNumber}} "{{.RepoPath}}"
        # Companion to C, not a replacement: tuicr reads the diff, octo edits
        # PR metadata and threads comments. Opens a tmux window rather than
        # taking over the popup, so the editor outlives the dash.
        - key: E
          name: edit PR (octo)
          command: >
            ~/code/seabbs/dotfiles/scripts/octo-review.sh
            {{.RepoName}} {{.PrNumber}} "{{.RepoPath}}"
        - key: O
          builtin: checkout
        - key: V
          name: review & merge
          command: >
            echo "Review comment for PR #{{.PrNumber}}:";
            read -r comment;
            gh pr review {{.PrNumber}} --repo {{.RepoName}}
            --approve --body "$comment" &&
            gh pr merge {{.PrNumber}} --repo {{.RepoName}}
            --squash
        - key: M
          name: merge PR
          command: >
            gh pr merge {{.PrNumber}} --repo {{.RepoName}}
            --squash
        - key: R
          name: request reviewer
          command: >
            echo "Enter reviewer username:"; read reviewer;
            gh pr edit {{.PrNumber}} --repo {{.RepoName}}
            --add-reviewer "$reviewer"
    issues:
        - key: S
          name: open issue session
          command: zsh -ic "issuesesh {{.RepoName}} {{.IssueNumber}}"
        - key: a
          name: open agent
          command: zsh -ic "agent {{.RepoName}}"
repoPaths:
    epinowcast/*: ~/code/epinowcast/*
    epiforecasts/*: ~/code/epiforecasts/*
    EpiAware/*: ~/code/EpiAware/*
    nfidd/*: ~/code/nfidd/*
    seabbs/*: ~/code/seabbs/*
theme:
    ui:
        sectionsShowCount: true
        table:
            showSeparator: true
            compact: false
pager:
    diff: delta
confirmQuit: false
showAuthorIcons: true
smartFilteringAtLaunch: true
