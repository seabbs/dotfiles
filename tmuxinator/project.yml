# Generic project template
# Usage: tmuxinator start project <project-name>
#
# Creates a session with:
#   - nvim (left pane, 50%)
#   - ai (top-right pane, 25%)
#   - R or Julia REPL (bottom-right pane, 25%, auto-detected)

name: <%= @args[0] %>
root: <%= @args[1] %>

startup_window: main

on_project_start: |
  # Best-effort pane titles (pane-base-index is 1). on_project_start can run
  # before the panes exist, so tolerate a missing pane rather than emit
  # "can't find pane" on every new session.
  tmux select-pane -t 1 -T "nvim" 2>/dev/null || true
  tmux select-pane -t 2 -T "ai:main" 2>/dev/null || true
  tmux select-pane -t 3 -T "repl" 2>/dev/null || true

windows:
  - main:
      layout: main-vertical
      panes:
        - nvim .
        - ${AGENT_CLI_DEV_TOOL:-claude}
        - >-
          if [ -f Project.toml ]; then
            julia --project=.
          elif [ -f DESCRIPTION ]; then
            R
          else
            echo "No R or Julia project detected"
            zsh
          fi
